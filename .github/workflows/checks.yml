name: "Checks"
on:
  pull_request:
  workflow_call:
  workflow_dispatch:

jobs:
  validate-check:
    name: 🗿 Validate Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Run validation
        run: ./validate.sh
